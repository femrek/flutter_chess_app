name: localchess
description: A new Flutter project.

publish_to: 'none'
version: 2.0.1+20

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Modules
  core:
    path: module/core
  widget:
    path: module/widget
  gen:
    path: module/gen

  # Util
  chess: ^0.8.0
  equatable: ^2.0.5
  url_launcher: ^6.3.2
  easy_localization: ^3.0.7
  get_it: ^9.2.1
  logger: ^2.7.0
  uuid: ^4.4.2
  async: ^2.11.0

  # State Management
  flutter_bloc: ^8.1.6

  # Navigation
  auto_route: ^11.1.0

  # UI
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
  auto_route_generator: ^10.5.0
  bloc_test: ^9.1.7
  # for testing
  shared_preferences: any

flutter:
  uses-material-design: true

  assets:
    - asset/translation/
